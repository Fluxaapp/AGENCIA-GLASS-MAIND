name: SlideVol Android APK
on:
  push:
    branches: [slidevol-v1-2-work]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: slidevol
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare standalone APK
        run: cp slidevol/app/build/outputs/apk/debug/app-debug.apk SlideVol-1.2.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view slidevol-v1-2-apk >/dev/null 2>&1; then
            gh release upload slidevol-v1-2-apk SlideVol-1.2.apk --clobber
          else
            gh release create slidevol-v1-2-apk SlideVol-1.2.apk --title 'SlideVol v1.2 - Android APK' --notes 'SlideVol 1.2: visual personalizavel, opacidade em repouso, gesto direto e silenciamento amplo. Sem servico de digitais.' --target "$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SlideVol-APK
          path: SlideVol-1.2.apk